name: Generate showcase previews

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generate_showcase_previews.py"
      - ".github/workflows/generate-previews.yml"

permissions:
  contents: write

jobs:
  previews:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Generate sanitized screenshots
        run: python scripts/generate_showcase_previews.py
      - name: Commit refreshed previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/nexus-*.png
          if git diff --cached --quiet; then
            echo "Preview assets already up to date."
          else
            git commit -m "assets: refresh Nexus AI showcase screenshots"
            git push
          fi
      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-ai-showcase-previews
          path: assets/nexus-*.png
          if-no-files-found: error
