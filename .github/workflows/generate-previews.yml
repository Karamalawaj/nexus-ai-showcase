name: Generate showcase previews

on:
  push:
    paths:
      - 'scripts/generate_showcase_previews.py'
      - '.github/workflows/generate-previews.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  previews:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Generate sanitized screenshots
        run: python scripts/generate_showcase_previews.py
      - name: Commit generated previews
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/nexus-*.png
          if git diff --cached --quiet; then
            echo 'No preview changes to commit.'
          else
            git commit -m 'Refresh high-quality Nexus AI previews [skip ci]'
            git push
          fi
